name: Build Help Desk, Deploy Public Site, and Invalidate CloudFront

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: HelpDesk/package-lock.json

      - name: Install HelpDesk dependencies
        run: npm ci
        working-directory: HelpDesk

      - name: Build HelpDesk into Public/help
        run: npm run build:help

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::035281989974:role/github-action-public-role
          aws-region: us-east-1

      - name: Deploy public site to S3
        run: aws s3 sync ./Public s3://${{ secrets.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
